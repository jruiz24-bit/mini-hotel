<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Hotel Paraiso</title>
</head>
<body>
    <header>
        <h1>Hotel ParaIso</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="habitaciones.html">Habitaciones</a></li>
                <li><a href="servicios.html">Servicios Extra</a></li>
                <li><a href="nosotros.html">Sobre Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Contacto</h2>

        <section>
            <h3>Contactanos</h3>
            <form action="#" method="GET">
                <label for="nombre_contacto">Nombre:</label>
                <input type="text" id="nombre_contacto" name="nombre_contacto" required>
                <br><br>

                <label for="email_contacto">Correo electronico:</label>
                <input type="email" id="email_contacto" name="email_contacto" required>
                <br><br>

                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="4" cols="30" required></textarea>
                <br><br>

                <button type="submit">Enviar</button>
            </form>
        </section>

        <section>
            <h3>Datos del hotel</h3>
            <p><strong>Direccion:</strong> Calle Tranquilidad 123, Ciudad Descanso</p>
            <p><strong>Telefono:</strong> (612) 12345678</p>
            <p><strong>Email:</strong> reservas@hotelparaiso.com</p>
        </section>

        <section>
            <h3>Ubicacion</h3>
            
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d48982.9454095654!2d-110.32169678005727!3d24.147901733751947!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2smx!4v1790976848463!5m2!1ses-419!2smx" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
    </main>

    <footer>
        <p> 2026 Hotel Paraiso</p>
    </footer>
</body>
</html>
